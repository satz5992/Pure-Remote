plugins {
    id 'com.android.application'
}

android {
    namespace 'com.satz.tvremote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.satz.tvremote'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'pureremote'
            keyAlias 'pureremote'
            keyPassword 'pureremote'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
