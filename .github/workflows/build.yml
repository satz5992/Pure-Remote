name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log || {
            grep -E "error:|ERROR:|e: |FAILED|What went wrong" -A3 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          cp app/build/outputs/apk/release/app-release.apk PureRemote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PureRemote-apk
          path: PureRemote.apk

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Pure Remote v1.1.${{ github.run_number }}
          body: "Ad-free TV remote - Wi-Fi (Android/Google TV) and IR blaster (any TV). Download PureRemote.apk below and install it on your phone."
          files: PureRemote.apk
          make_latest: true
